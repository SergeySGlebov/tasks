<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <style>
        .error-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .error-code {
            font-size: 72px;
            color: #dc3545;
        }
        .error-message {
            margin: 20px 0;
            font-size: 24px;
        }
        .back-link {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code" th:text="${error}">Ошибка</div>
    <div class="error-message" th:text="${message}">Сообщение об ошибке</div>
    <div class="back-link">
        <a href="/">Вернуться на главную</a>
    </div>
</div>
</body>
</html>
